<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… | root+</title>
  <!-- Each product now has its own static page (balance.html / goodnight.html)
       so crawlers and the LINE and Facebook share bots get a real title,
       description and preview image. This file only exists to keep the older
       product.html?product=… links that may already be shared working. -->
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://louissrichand.github.io/Demo/balance.html" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    (function () {
      var PAGES = { balance: "balance.html", goodnight: "goodnight.html" };
      var m = location.search.match(/[?&]product=([a-z]+)/i);
      var id = m ? m[1].toLowerCase() : "balance";
      var target = PAGES[id] || "balance.html";
      /* Carry any referral or campaign tags across the hop. */
      var qs = location.search.replace(/[?&]product=[a-z]+/i, "").replace(/^[?&]/, "");
      location.replace(target + (qs ? "?" + qs : "") + location.hash);
    })();
  </script>
</head>
<body>
  <main style="min-height:60vh;display:grid;place-items:center;text-align:center;padding:2rem">
    <p>
      Taking you to the product page…<br />
      <a href="balance.html">Balance</a> ·
      <a href="goodnight.html">Goodnight</a>
    </p>
  </main>
</body>
</html>
